AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bridgefu for Vapi transfers to an existing Amazon Connect instance. Creates
  one Bridgefu EC2 gateway, DynamoDB context storage, Lambdas, Connect wrapper
  flows, monitoring, and a new Vapi template assistant.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Deployment}
        Parameters: [DeploymentId, InstanceType]
      - Label: {default: Amazon Connect}
        Parameters: [ConnectInstanceArn, TargetContactFlowArn]
      - Label: {default: Public SIP DNS}
        Parameters: [PublicHostedZoneId, SipHostname]
      - Label: {default: Vapi template assistant}
        Parameters: [VapiApiKeySecretArn, VapiModel, VapiVoiceId]
      - Label: {default: Agent screen pop}
        Parameters: [ScreenPopFieldsJson, RoutingJson, ContextTtlSeconds]
      - Label: {default: Capacity and operations}
        Parameters: [MaxConcurrentCalls, LogRetentionDays, AlarmEmail]
      - Label: {default: Retention}
        Parameters: [DataRetentionMode]
      - Label: {default: Advanced network controls}
        Parameters: [SipSecurity]
    ParameterLabels:
      DeploymentId: {default: Deployment name}
      InstanceType: {default: Bridgefu EC2 size}
      VapiApiKeySecretArn: {default: Vapi private-key secret ARN}
      VapiModel: {default: Initial Vapi model}
      VapiVoiceId: {default: Initial Vapi voice}
      ConnectInstanceArn: {default: Existing Amazon Connect instance ARN}
      TargetContactFlowArn: {default: Published destination contact-flow ARN}
      PublicHostedZoneId: {default: Public Route53 hosted-zone ID}
      SipHostname: {default: Bridgefu SIP hostname}
      ScreenPopFieldsJson: {default: Screen-pop fields (advanced JSON)}
      RoutingJson: {default: Optional routing rules (advanced JSON)}
      ContextTtlSeconds: {default: Caller-context lifetime in seconds}
      MaxConcurrentCalls: {default: Maximum concurrent calls}
      LogRetentionDays: {default: CloudWatch log retention in days}
      AlarmEmail: {default: Optional alarm email}
      DataRetentionMode: {default: Deletion behavior}
      SipSecurity: {default: SIP transport and media security}

Parameters:
  DeploymentId:
    Type: String
    Default: support
    MinLength: 3
    MaxLength: 24
    AllowedPattern: '^[a-z][a-z0-9-]+$'
    Description: Short name used in Bridgefu-owned AWS and Vapi resource names.
  InstanceType:
    Type: String
    Default: c7g.2xlarge
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge, t4g.2xlarge, c7g.large, c7g.xlarge, c7g.2xlarge, m7g.large, m7g.xlarge, m7g.2xlarge]
    Description: ARM64 instance size for the single Bridgefu gateway.
  ConnectInstanceArn:
    Type: String
    Description: Existing active Amazon Connect instance in this account and region.
    AllowedPattern: '^arn:aws[-a-z0-9]*:connect:[-a-z0-9]+:[0-9]{12}:instance/[A-Za-z0-9-]+$'
  TargetContactFlowArn:
    Type: String
    Description: Existing published flow Bridgefu transfers into after the screen pop.
    AllowedPattern: '^arn:aws[-a-z0-9]*:connect:[-a-z0-9]+:[0-9]{12}:instance/[A-Za-z0-9-]+/contact-flow/[A-Za-z0-9-]+$'
  PublicHostedZoneId:
    Type: String
    Description: Existing public Route53 hosted zone that will own the SIP hostname.
    AllowedPattern: '^[A-Z0-9]+$'
  SipHostname:
    Type: String
    Description: New unused name beneath the hosted zone, for example bridgefu.example.com.
    AllowedPattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])$'
  VapiApiKeySecretArn:
    Type: String
    AllowedPattern: '^arn:aws[-a-z0-9]*:secretsmanager:[-a-z0-9]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: >-
      ARN of an existing Secrets Manager secret whose SecretString is the Vapi
      private API key. The key itself is never a CloudFormation parameter.
  VapiModel:
    Type: String
    Default: gpt-4.1-mini
    AllowedPattern: '^[A-Za-z0-9._:/-]{1,128}$'
    Description: Initial template value only; later stack updates never rewrite the assistant.
  VapiVoiceId:
    Type: String
    Default: Elliot
    AllowedPattern: '^[A-Za-z0-9._:/-]{1,128}$'
    Description: Initial template value only; later stack updates never rewrite the assistant.
  ScreenPopFieldsJson:
    Type: String
    MaxLength: 4096
    Default: '[{"key":"customer_name","label":"Customer","description":"Caller name for the agent.","type":"text","required":true,"max_length":256},{"key":"issue_summary","label":"Issue","description":"Short reason for the transfer.","type":"text","required":true,"max_length":1024},{"key":"intent","label":"Intent","description":"Routing or support intent.","type":"text","required":true,"max_length":128},{"key":"verification_status","label":"Verification","description":"Verification completed before transfer.","type":"choice","required":true,"choices":["verified","not_verified","not_required"]}]'
    Description: Keep the four-field default initially; see the deployment guide before editing.
  RoutingJson:
    Type: String
    Default: '{}'
    MaxLength: 4096
    Description: Optional reviewed choice-value to published Connect flow mapping.
  ContextTtlSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 604800
    Description: Time from context storage to Connect lookup; 300 seconds through 7 days.
  MaxConcurrentCalls:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Admission limit used by Bridgefu and its monitoring thresholds.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: Retention for Bridgefu-owned CloudWatch log groups.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address for the Bridgefu alarm topic subscription.
  DataRetentionMode:
    Type: String
    Default: ProductionRetain
    AllowedValues: [ProductionRetain, TestDelete]
    Description: >-
      Immutable after stack creation. ProductionRetain preserves context,
      runtime data, and the Vapi template on deletion; TestDelete is only for
      disposable qualification stacks.
  SipSecurity:
    Type: String
    Default: sips_optional_srtp
    AllowedValues: [sips_optional_srtp, sips_srtp, sip_rtp]
    Description: >-
      sips_optional_srtp keeps SIP signaling on TLS, prefers SRTP, and accepts
      RTP/AVP when the peer does not offer SRTP. Choose sips_srtp to require
      SRTP. Plain sip_rtp is a qualification diagnostic and is rejected unless
      DataRetentionMode is TestDelete.

Mappings:
  RegionRelease:
    us-east-1:
      AmiId: __AMI_US_EAST_1__
      ArtifactBucket: __ARTIFACT_BUCKET_US_EAST_1__
      ConfigurationArtifactVersion: __CONFIGURATION_ARTIFACT_VERSION_US_EAST_1__
      VapiProvisionerArtifactVersion: __VAPI_PROVISIONER_ARTIFACT_VERSION_US_EAST_1__
      HandoffPrepareArtifactVersion: __HANDOFF_PREPARE_ARTIFACT_VERSION_US_EAST_1__
      HandoffTransferArtifactVersion: __HANDOFF_TRANSFER_ARTIFACT_VERSION_US_EAST_1__
      HandoffLookupArtifactVersion: __HANDOFF_LOOKUP_ARTIFACT_VERSION_US_EAST_1__
    us-west-2:
      AmiId: __AMI_US_WEST_2__
      ArtifactBucket: __ARTIFACT_BUCKET_US_WEST_2__
      ConfigurationArtifactVersion: __CONFIGURATION_ARTIFACT_VERSION_US_WEST_2__
      VapiProvisionerArtifactVersion: __VAPI_PROVISIONER_ARTIFACT_VERSION_US_WEST_2__
      HandoffPrepareArtifactVersion: __HANDOFF_PREPARE_ARTIFACT_VERSION_US_WEST_2__
      HandoffTransferArtifactVersion: __HANDOFF_TRANSFER_ARTIFACT_VERSION_US_WEST_2__
      HandoffLookupArtifactVersion: __HANDOFF_LOOKUP_ARTIFACT_VERSION_US_WEST_2__

Rules:
  SupportedRegion:
    Assertions:
      - Assert: !Contains
          - [us-east-1, us-west-2]
          - !Ref 'AWS::Region'
        AssertDescription: >-
          Release __RELEASE_VERSION__ supports the two US Amazon Connect
          regions: us-west-2 and us-east-1.
  PlainSipOnlyForDisposableTests:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref SipSecurity, sips_optional_srtp]
          - !Equals [!Ref SipSecurity, sips_srtp]
          - !Equals [!Ref DataRetentionMode, TestDelete]
        AssertDescription: >-
          sip_rtp is permitted only for disposable qualification stacks with
          DataRetentionMode=TestDelete. Production must use a SIPS mode.

Conditions:
  RetainCustomerData: !Equals [!Ref DataRetentionMode, ProductionRetain]

Resources:
  Configuration:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/configuration.yaml?versionId=__NESTED_CONFIGURATION_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !Ref DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ConfigurationArtifactKey: __RELEASE_PREFIX__/__RELEASE_VERSION__/artifacts/lambda/configuration.zip
        ConfigurationArtifactVersion: !FindInMap [RegionRelease, !Ref 'AWS::Region', ConfigurationArtifactVersion]
        ConnectInstanceArn: !Ref ConnectInstanceArn
        TargetContactFlowArn: !Ref TargetContactFlowArn
        PublicHostedZoneId: !Ref PublicHostedZoneId
        SipHostname: !Ref SipHostname
        SipSecurity: !Ref SipSecurity
        MaxConcurrentCalls: !Ref MaxConcurrentCalls
        VapiApiKeySecretArn: !Ref VapiApiKeySecretArn
        DataRetentionMode: !Ref DataRetentionMode
        RuntimeImageId: !FindInMap [RegionRelease, !Ref 'AWS::Region', AmiId]
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        RoutingJson: !Ref RoutingJson
        LogRetentionDays: !Ref LogRetentionDays

  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/network.yaml?versionId=__NESTED_NETWORK_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        NetworkMode: NewVpc
        VpcCidr: 10.42.0.0/16
        CreateNatGateways: 'false'
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

  HandoffService:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/handoff-service.yaml?versionId=__NESTED_HANDOFF_SERVICE_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        PrepareArtifactKey: __RELEASE_PREFIX__/__RELEASE_VERSION__/artifacts/lambda/prepare_handoff.zip
        PrepareArtifactVersion: !FindInMap [RegionRelease, !Ref 'AWS::Region', HandoffPrepareArtifactVersion]
        TransferArtifactKey: __RELEASE_PREFIX__/__RELEASE_VERSION__/artifacts/lambda/transfer_destination.zip
        TransferArtifactVersion: !FindInMap [RegionRelease, !Ref 'AWS::Region', HandoffTransferArtifactVersion]
        LookupArtifactKey: __RELEASE_PREFIX__/__RELEASE_VERSION__/artifacts/lambda/connect_lookup.zip
        LookupArtifactVersion: !FindInMap [RegionRelease, !Ref 'AWS::Region', HandoffLookupArtifactVersion]
        BridgefuControlBaseUrl: !Sub
          - 'https://control.${Hostname}'
          - Hostname: !GetAtt Configuration.Outputs.SipHostname
        BridgefuRouteId: support
        SipSecurity: !GetAtt Configuration.Outputs.SipSecurity
        ContextTtlSeconds: !Ref ContextTtlSeconds
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        RoutingFieldKey: !GetAtt Configuration.Outputs.RoutingFieldKey
        LambdaReservedConcurrencyPerFunction: 0
        DataRetentionMode: !GetAtt Configuration.Outputs.DataRetentionMode
        LogRetentionDays: !Ref LogRetentionDays
        TransferSubnetIds: !GetAtt Network.Outputs.PrivateSubnetIds
        TransferSecurityGroupIds: !GetAtt Network.Outputs.TransferFunctionSecurityGroupId
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

  ConnectIntegration:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/connect.yaml?versionId=__NESTED_CONNECT_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        ConnectInstanceArn: !GetAtt Configuration.Outputs.ConnectInstanceArn
        TargetContactFlowArn: !Ref TargetContactFlowArn
        LookupFunctionArn: !GetAtt HandoffService.Outputs.LookupFunctionArn
        AgentGuideTemplateString: !GetAtt Configuration.Outputs.AgentGuideTemplateString
        RoutingNextAction: !GetAtt Configuration.Outputs.RoutingNextAction
        RoutingDecisionActionJson: !GetAtt Configuration.Outputs.RoutingDecisionActionJson
        RoutingTransferActionsJson: !GetAtt Configuration.Outputs.RoutingTransferActionsJson
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

  Runtime:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/runtime.yaml?versionId=__NESTED_RUNTIME_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        VpcId: !GetAtt Network.Outputs.VpcId
        VpcCidr: !GetAtt Network.Outputs.VpcCidr
        PublicSubnet1Id: !GetAtt Network.Outputs.PublicSubnet1Id
        PublicSubnet1AvailabilityZone: !GetAtt Network.Outputs.PublicSubnet1AvailabilityZone
        TransferFunctionSecurityGroupId: !GetAtt Network.Outputs.TransferFunctionSecurityGroupId
        PublicHostedZoneId: !GetAtt Configuration.Outputs.PublicHostedZoneId
        SipHostname: !GetAtt Configuration.Outputs.SipHostname
        ControlHostname: !Sub
          - 'control.${Hostname}'
          - Hostname: !GetAtt Configuration.Outputs.SipHostname
        SipSecurity: !GetAtt Configuration.Outputs.SipSecurity
        VapiSignalingCidr1: 44.229.228.186/32
        VapiSignalingCidr2: 44.238.177.138/32
        VapiSignalingCidr3: ''
        VapiSignalingCidr4: ''
        MediaSourceCidr: 0.0.0.0/0
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ConnectInstanceArn: !GetAtt Configuration.Outputs.ConnectInstanceArn
        ConnectEntryFlowArn: !GetAtt ConnectIntegration.Outputs.WrapperFlowArn
        ConnectEntryFlowId: !GetAtt ConnectIntegration.Outputs.WrapperFlowId
        BridgefuApiBearerSecretArn: !GetAtt HandoffService.Outputs.BridgefuApiBearerSecretArn
        InstanceType: !Ref InstanceType
        AmiId: !GetAtt Configuration.Outputs.RuntimeImageId
        RootVolumeGiB: 24
        DataVolumeGiB: 20
        DataRetentionMode: !GetAtt Configuration.Outputs.DataRetentionMode
        MaxConcurrentCalls: !GetAtt Configuration.Outputs.MaxConcurrentCalls
        LogRetentionDays: !Ref LogRetentionDays
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

  VapiResources:
    Type: AWS::CloudFormation::Stack
    DependsOn: Runtime
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/vapi.yaml?versionId=__NESTED_VAPI_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ProvisionerArtifactKey: __RELEASE_PREFIX__/__RELEASE_VERSION__/artifacts/lambda/vapi_provisioner.zip
        ProvisionerArtifactVersion: !FindInMap [RegionRelease, !Ref 'AWS::Region', VapiProvisionerArtifactVersion]
        VapiApiKeySecretArn: !Ref VapiApiKeySecretArn
        VapiWebhookSecretArn: !GetAtt HandoffService.Outputs.VapiWebhookSecretArn
        VapiIdentityBindingArn: !GetAtt HandoffService.Outputs.VapiIdentityBindingArn
        PrepareUrl: !GetAtt HandoffService.Outputs.PrepareUrl
        TransferUrl: !GetAtt HandoffService.Outputs.TransferUrl
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        VapiModel: !Ref VapiModel
        VapiVoiceId: !Ref VapiVoiceId
        LambdaReservedConcurrencyPerFunction: 0
        LogRetentionDays: !Ref LogRetentionDays
        RetainVapiResourcesOnDelete: !GetAtt Configuration.Outputs.RetainVapiResourcesOnDelete
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

  Observability:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/observability.yaml?versionId=__NESTED_OBSERVABILITY_VERSION_ID_URLENCODED__
      Parameters:
        DeploymentId: !GetAtt Configuration.Outputs.DeploymentId
        ApiId: !GetAtt HandoffService.Outputs.ApiId
        HandoffTableName: !GetAtt HandoffService.Outputs.HandoffTableName
        PrepareFunctionName: !GetAtt HandoffService.Outputs.PrepareFunctionName
        TransferFunctionName: !GetAtt HandoffService.Outputs.TransferFunctionName
        LookupFunctionName: !GetAtt HandoffService.Outputs.LookupFunctionName
        ProvisionerFunctionName: !GetAtt VapiResources.Outputs.ProvisionerFunctionName
        PrepareLogGroupName: !GetAtt HandoffService.Outputs.PrepareLogGroupName
        TransferLogGroupName: !GetAtt HandoffService.Outputs.TransferLogGroupName
        LookupLogGroupName: !GetAtt HandoffService.Outputs.LookupLogGroupName
        RuntimeInstanceId: !GetAtt Runtime.Outputs.InstanceId
        RuntimeLogGroupName: !GetAtt Runtime.Outputs.RuntimeLogGroupName
        SipSecurity: !GetAtt Configuration.Outputs.SipSecurity
        MaxConcurrentCalls: !GetAtt Configuration.Outputs.MaxConcurrentCalls
        AlarmEmail: !Ref AlarmEmail
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !GetAtt Configuration.Outputs.DeploymentId

Outputs:
  ReleaseVersion:
    Value: __RELEASE_VERSION__
  BridgefuAmiId:
    Value: !FindInMap [RegionRelease, !Ref 'AWS::Region', AmiId]
  ArtifactBucket:
    Value: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
  BridgefuSipUri:
    Value: !GetAtt Runtime.Outputs.SipUri
  BridgefuInstanceId:
    Value: !GetAtt Runtime.Outputs.InstanceId
  BridgefuInstancePrivateIp:
    Description: Private address used only by same-VPC operators and qualification tooling.
    Value: !GetAtt Runtime.Outputs.InstancePrivateIp
  BridgefuVpcId:
    Description: Dedicated Bridgefu VPC identifier.
    Value: !GetAtt Network.Outputs.VpcId
  BridgefuPrivateSubnetIds:
    Description: Private runtime subnet IDs used only by qualification tooling.
    Value: !GetAtt Network.Outputs.PrivateSubnetIds
  BridgefuTransferSecurityGroupId:
    Description: Private control-client security group used only by qualification tooling.
    Value: !GetAtt Network.Outputs.TransferFunctionSecurityGroupId
  BridgefuGatewaySecurityGroupId:
    Description: Runtime ingress security group used only by qualification tooling.
    Value: !GetAtt Runtime.Outputs.GatewaySecurityGroupId
  BridgefuGatewayRoleName:
    Description: Runtime role name used only by qualification tooling for an exact temporary policy.
    Value: !GetAtt Runtime.Outputs.GatewayRoleName
  BridgefuPublicIp:
    Description: Public media address used by qualification WebRTC ICE.
    Value: !GetAtt Runtime.Outputs.PublicIp
  VapiAssistantId:
    Value: !GetAtt VapiResources.Outputs.AssistantId
  VapiProvisioningStackId:
    Value: !GetAtt VapiResources.Outputs.ProvisioningStackId
  VapiPrepareUrl:
    Value: !GetAtt VapiResources.Outputs.PrepareUrl
  VapiTransferUrl:
    Value: !GetAtt VapiResources.Outputs.TransferUrl
  VapiModel:
    Value: !GetAtt VapiResources.Outputs.VapiModel
  VapiVoiceId:
    Value: !GetAtt VapiResources.Outputs.VapiVoiceId
  ScreenPopFieldsJson:
    Value: !GetAtt VapiResources.Outputs.ScreenPopFieldsJson
  VapiPrepareToolId:
    Value: !GetAtt VapiResources.Outputs.PrepareToolId
  VapiWebhookCredentialId:
    Value: !GetAtt VapiResources.Outputs.WebhookCredentialId
  ConnectWrapperFlowArn:
    Value: !GetAtt ConnectIntegration.Outputs.WrapperFlowArn
  AgentGuideFlowArn:
    Value: !GetAtt ConnectIntegration.Outputs.AgentGuideFlowArn
  HandoffTableName:
    Value: !GetAtt HandoffService.Outputs.HandoffTableName
  HandoffTableArn:
    Value: !GetAtt HandoffService.Outputs.HandoffTableArn
  VapiWebhookSecretArn:
    Description: Secret ARN only; the webhook bearer value is never a stack output.
    Value: !GetAtt HandoffService.Outputs.VapiWebhookSecretArn
  VapiIdentityBindingArn:
    Description: Secret ARN only; the validated Vapi binding is never embedded in a template.
    Value: !GetAtt HandoffService.Outputs.VapiIdentityBindingArn
  BridgefuApiBearerSecretArn:
    Description: Secret ARN only; the Bridgefu control bearer value is never a stack output.
    Value: !GetAtt HandoffService.Outputs.BridgefuApiBearerSecretArn
  CorrelationKeySecretArn:
    Description: Secret ARN only; the correlation key value is never a stack output.
    Value: !GetAtt HandoffService.Outputs.CorrelationKeySecretArn
  RuntimeLogGroupName:
    Value: !GetAtt Runtime.Outputs.RuntimeLogGroupName
  LookupLogGroupName:
    Value: !GetAtt HandoffService.Outputs.LookupLogGroupName
  ScreenPopSchemaHash:
    Value: !GetAtt Configuration.Outputs.SchemaHash
  DashboardUrl:
    Value: !GetAtt Observability.Outputs.DashboardUrl
  SsmStartSessionCommand:
    Value: !GetAtt Runtime.Outputs.SsmStartSessionCommand
  VapiRetentionNotice:
    Value: !If
      - RetainCustomerData
      - The Vapi assistant, tool, and credential are retained when this stack is deleted.
      - The disposable Vapi assistant, tool, and credential are deleted with this stack.
