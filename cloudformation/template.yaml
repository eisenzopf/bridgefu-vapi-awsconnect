AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bridgefu for Vapi transfers to an existing Amazon Connect instance. Creates
  one Bridgefu EC2 gateway, DynamoDB context storage, Lambdas, Connect wrapper
  flows, monitoring, and a new Vapi template assistant.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Deployment}
        Parameters: [DeploymentId, InstanceType]
      - Label: {default: Amazon Connect}
        Parameters: [ConnectInstanceArn, TargetContactFlowArn]
      - Label: {default: Public SIP DNS}
        Parameters: [PublicHostedZoneId, SipHostname]
      - Label: {default: Vapi template assistant}
        Parameters: [VapiRegion, VapiApiKeySecretArn, VapiModel, VapiVoiceId]
      - Label: {default: Agent screen pop}
        Parameters: [ScreenPopFieldsJson, RoutingJson, ContextTtlSeconds]
      - Label: {default: Capacity and operations}
        Parameters: [MaxConcurrentCalls, LogRetentionDays, AlarmEmail]
      - Label: {default: Retention}
        Parameters: [DataRetentionMode]
      - Label: {default: Advanced network controls}
        Parameters: [VpcCidr]
    ParameterLabels:
      DeploymentId: {default: Deployment name}
      InstanceType: {default: Bridgefu EC2 size}
      VapiApiKeySecretArn: {default: Vapi private-key secret ARN}
      VapiRegion: {default: Vapi organization region}
      VapiModel: {default: Initial Vapi model}
      VapiVoiceId: {default: Initial Vapi voice}
      ConnectInstanceArn: {default: Existing Amazon Connect instance ARN}
      TargetContactFlowArn: {default: Published destination contact-flow ARN}
      PublicHostedZoneId: {default: Public Route53 hosted-zone ID}
      SipHostname: {default: Bridgefu SIP hostname}
      ScreenPopFieldsJson: {default: Screen-pop fields (advanced JSON)}
      RoutingJson: {default: Optional routing rules (advanced JSON)}
      ContextTtlSeconds: {default: Caller-context lifetime in seconds}
      MaxConcurrentCalls: {default: Maximum concurrent calls}
      LogRetentionDays: {default: CloudWatch log retention in days}
      AlarmEmail: {default: Optional alarm email}
      VpcCidr: {default: Dedicated Bridgefu VPC CIDR}
      DataRetentionMode: {default: Deletion behavior}

Parameters:
  DeploymentId:
    Type: String
    Default: support
    MinLength: 3
    MaxLength: 24
    AllowedPattern: '^[a-z][a-z0-9-]+$'
    Description: Short name used in Bridgefu-owned AWS and Vapi resource names.
  InstanceType:
    Type: String
    Default: t4g.large
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge, c7g.large, c7g.xlarge, m7g.large, m7g.xlarge]
    Description: ARM64 instance size for the single Bridgefu gateway.
  ConnectInstanceArn:
    Type: String
    Description: Existing active Amazon Connect instance in this account and region.
    AllowedPattern: '^arn:aws[-a-z0-9]*:connect:[-a-z0-9]+:[0-9]{12}:instance/[A-Za-z0-9-]+$'
  TargetContactFlowArn:
    Type: String
    Description: Existing published flow Bridgefu transfers into after the screen pop.
    AllowedPattern: '^arn:aws[-a-z0-9]*:connect:[-a-z0-9]+:[0-9]{12}:instance/[A-Za-z0-9-]+/contact-flow/[A-Za-z0-9-]+$'
  PublicHostedZoneId:
    Type: String
    Description: Existing public Route53 hosted zone that will own the SIP hostname.
    AllowedPattern: '^[A-Z0-9]+$'
  SipHostname:
    Type: String
    Description: New unused name beneath the hosted zone, for example bridgefu.example.com.
    AllowedPattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])$'
  VapiApiKeySecretArn:
    Type: String
    AllowedPattern: '^arn:aws[-a-z0-9]*:secretsmanager:[-a-z0-9]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: >-
      ARN of an existing Secrets Manager secret whose SecretString is the Vapi
      private API key. The key itself is never a CloudFormation parameter.
  VapiRegion:
    Type: String
    Default: US
    AllowedValues: [US, EU]
    Description: Region where the Vapi organization is hosted; controls API and SIP networking.
  VapiModel:
    Type: String
    Default: gpt-4.1-mini
    AllowedPattern: '^[A-Za-z0-9._:/-]{1,128}$'
    Description: Initial template value only; later stack updates never rewrite the assistant.
  VapiVoiceId:
    Type: String
    Default: Elliot
    AllowedPattern: '^[A-Za-z0-9._:/-]{1,128}$'
    Description: Initial template value only; later stack updates never rewrite the assistant.
  ScreenPopFieldsJson:
    Type: String
    MaxLength: 4096
    Default: '[{"key":"customer_name","label":"Customer","description":"Caller name for the agent.","type":"text","required":true,"max_length":256},{"key":"issue_summary","label":"Issue","description":"Short reason for the transfer.","type":"text","required":true,"max_length":1024},{"key":"intent","label":"Intent","description":"Routing or support intent.","type":"text","required":true,"max_length":128},{"key":"verification_status","label":"Verification","description":"Verification completed before transfer.","type":"choice","required":true,"choices":["verified","not_verified","not_required"]}]'
    Description: Keep the four-field default initially; see the deployment guide before editing.
  RoutingJson:
    Type: String
    Default: '{}'
    MaxLength: 4096
    Description: Optional reviewed choice-value to published Connect flow mapping.
  ContextTtlSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 604800
    Description: Time from context storage to Connect lookup; 300 seconds through 7 days.
  MaxConcurrentCalls:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Admission limit used by Bridgefu and its monitoring thresholds.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: Retention for Bridgefu-owned CloudWatch log groups.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address for the Bridgefu alarm topic subscription.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.).+$'
    Description: Private CIDR for the new dedicated two-subnet Bridgefu VPC.
  DataRetentionMode:
    Type: String
    Default: ProductionRetain
    AllowedValues: [ProductionRetain, TestDelete]
    Description: ProductionRetain protects context, audit data, and the Vapi template on stack deletion.

Mappings:
  VapiRegionConfiguration:
    US:
      ApiBaseUrl: https://api.vapi.ai
      SignalingCidr1: 44.229.228.186/32
      SignalingCidr2: 44.238.177.138/32
      MediaSourceCidr: 0.0.0.0/0
    EU:
      ApiBaseUrl: https://api.eu.vapi.ai
      SignalingCidr1: 63.182.83.170/32
      SignalingCidr2: 63.182.83.170/32
      MediaSourceCidr: 63.182.83.170/32
  RegionRelease:
    us-east-1:
      AmiId: __AMI_US_EAST_1__
      ArtifactBucket: __ARTIFACT_BUCKET_US_EAST_1__
    us-west-2:
      AmiId: __AMI_US_WEST_2__
      ArtifactBucket: __ARTIFACT_BUCKET_US_WEST_2__

Rules:
  SupportedRegion:
    Assertions:
      - Assert: !Contains
          - [us-east-1, us-west-2]
          - !Ref 'AWS::Region'
        AssertDescription: >-
          Release __RELEASE_VERSION__ supports the two US Amazon Connect
          regions: us-west-2 and us-east-1.

Conditions:
  RetainCustomerData: !Equals [!Ref DataRetentionMode, ProductionRetain]

Resources:
  Configuration:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/configuration.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ConfigurationArtifactKey: releases/__RELEASE_VERSION__/artifacts/lambda/configuration.zip
        ConnectInstanceArn: !Ref ConnectInstanceArn
        TargetContactFlowArn: !Ref TargetContactFlowArn
        PublicHostedZoneId: !Ref PublicHostedZoneId
        SipHostname: !Ref SipHostname
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        RoutingJson: !Ref RoutingJson
        LogRetentionDays: !Ref LogRetentionDays

  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/network.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        NetworkMode: NewVpc
        VpcCidr: !Ref VpcCidr
        CreateNatGateways: 'false'
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

  HandoffService:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/handoff-service.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        PrepareArtifactKey: releases/__RELEASE_VERSION__/artifacts/lambda/prepare_handoff.zip
        TransferArtifactKey: releases/__RELEASE_VERSION__/artifacts/lambda/transfer_destination.zip
        LookupArtifactKey: releases/__RELEASE_VERSION__/artifacts/lambda/connect_lookup.zip
        BridgefuControlBaseUrl: !Sub 'https://control.${SipHostname}'
        BridgefuRouteId: support
        SipSecurity: sips_srtp
        ContextTtlSeconds: !Ref ContextTtlSeconds
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        RoutingFieldKey: !GetAtt Configuration.Outputs.RoutingFieldKey
        LambdaReservedConcurrencyPerFunction: 0
        DataRetentionMode: !Ref DataRetentionMode
        LogRetentionDays: !Ref LogRetentionDays
        TransferSubnetIds: !GetAtt Network.Outputs.PrivateSubnetIds
        TransferSecurityGroupIds: !GetAtt Network.Outputs.TransferFunctionSecurityGroupId
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

  ConnectIntegration:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/connect.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        ConnectInstanceArn: !Ref ConnectInstanceArn
        TargetContactFlowArn: !Ref TargetContactFlowArn
        LookupFunctionArn: !GetAtt HandoffService.Outputs.LookupFunctionArn
        AgentGuideTemplateString: !GetAtt Configuration.Outputs.AgentGuideTemplateString
        RoutingConditionsJson: !GetAtt Configuration.Outputs.RoutingConditionsJson
        RoutingTransferActionsJson: !GetAtt Configuration.Outputs.RoutingTransferActionsJson
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

  Runtime:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/runtime.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        VpcId: !GetAtt Network.Outputs.VpcId
        VpcCidr: !GetAtt Network.Outputs.VpcCidr
        PublicSubnet1Id: !GetAtt Network.Outputs.PublicSubnet1Id
        PublicSubnet1AvailabilityZone: !GetAtt Network.Outputs.PublicSubnet1AvailabilityZone
        TransferFunctionSecurityGroupId: !GetAtt Network.Outputs.TransferFunctionSecurityGroupId
        PublicHostedZoneId: !Ref PublicHostedZoneId
        SipHostname: !Ref SipHostname
        ControlHostname: !Sub 'control.${SipHostname}'
        SipSecurity: sips_srtp
        VapiSignalingCidr1: !FindInMap [VapiRegionConfiguration, !Ref VapiRegion, SignalingCidr1]
        VapiSignalingCidr2: !FindInMap [VapiRegionConfiguration, !Ref VapiRegion, SignalingCidr2]
        VapiSignalingCidr3: ''
        VapiSignalingCidr4: ''
        MediaSourceCidr: !FindInMap [VapiRegionConfiguration, !Ref VapiRegion, MediaSourceCidr]
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ConnectInstanceArn: !Ref ConnectInstanceArn
        ConnectEntryFlowArn: !GetAtt ConnectIntegration.Outputs.WrapperFlowArn
        ConnectEntryFlowId: !GetAtt ConnectIntegration.Outputs.WrapperFlowId
        BridgefuApiBearerSecretArn: !GetAtt HandoffService.Outputs.BridgefuApiBearerSecretArn
        InstanceType: !Ref InstanceType
        AmiId: !FindInMap [RegionRelease, !Ref 'AWS::Region', AmiId]
        RootVolumeGiB: 24
        DataVolumeGiB: 20
        DataRetentionMode: !Ref DataRetentionMode
        MaxConcurrentCalls: !Ref MaxConcurrentCalls
        LogRetentionDays: !Ref LogRetentionDays
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

  VapiResources:
    Type: AWS::CloudFormation::Stack
    DependsOn: Runtime
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/vapi.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        ArtifactBucket: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
        ProvisionerArtifactKey: releases/__RELEASE_VERSION__/artifacts/lambda/vapi_provisioner.zip
        VapiApiKeySecretArn: !Ref VapiApiKeySecretArn
        VapiApiBaseUrl: !FindInMap [VapiRegionConfiguration, !Ref VapiRegion, ApiBaseUrl]
        VapiWebhookSecretArn: !GetAtt HandoffService.Outputs.VapiWebhookSecretArn
        VapiIdentityBindingArn: !GetAtt HandoffService.Outputs.VapiIdentityBindingArn
        PrepareUrl: !GetAtt HandoffService.Outputs.PrepareUrl
        TransferUrl: !GetAtt HandoffService.Outputs.TransferUrl
        ScreenPopFieldsJson: !Ref ScreenPopFieldsJson
        VapiModel: !Ref VapiModel
        VapiVoiceId: !Ref VapiVoiceId
        LambdaReservedConcurrencyPerFunction: 0
        LogRetentionDays: !Ref LogRetentionDays
        RetainVapiResourcesOnDelete: !If [RetainCustomerData, 'true', 'false']
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

  Observability:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: __NESTED_TEMPLATE_BASE_URL__/nested/observability.yaml
      Parameters:
        DeploymentId: !Ref DeploymentId
        ApiId: !GetAtt HandoffService.Outputs.ApiId
        HandoffTableName: !GetAtt HandoffService.Outputs.HandoffTableName
        PrepareFunctionName: !GetAtt HandoffService.Outputs.PrepareFunctionName
        TransferFunctionName: !GetAtt HandoffService.Outputs.TransferFunctionName
        LookupFunctionName: !GetAtt HandoffService.Outputs.LookupFunctionName
        ProvisionerFunctionName: !GetAtt VapiResources.Outputs.ProvisionerFunctionName
        PrepareLogGroupName: !GetAtt HandoffService.Outputs.PrepareLogGroupName
        TransferLogGroupName: !GetAtt HandoffService.Outputs.TransferLogGroupName
        LookupLogGroupName: !GetAtt HandoffService.Outputs.LookupLogGroupName
        RuntimeInstanceId: !GetAtt Runtime.Outputs.InstanceId
        RuntimeLogGroupName: !GetAtt Runtime.Outputs.RuntimeLogGroupName
        SipSecurity: sips_srtp
        MaxConcurrentCalls: !Ref MaxConcurrentCalls
        AlarmEmail: !Ref AlarmEmail
        ProjectTag: bridgefu-vapi-awsconnect
        ManagedByTag: bridgefu-cloudformation
        ExecutionIdTag: !Ref DeploymentId

Outputs:
  ReleaseVersion:
    Value: __RELEASE_VERSION__
  BridgefuAmiId:
    Value: !FindInMap [RegionRelease, !Ref 'AWS::Region', AmiId]
  ArtifactBucket:
    Value: !FindInMap [RegionRelease, !Ref 'AWS::Region', ArtifactBucket]
  BridgefuSipUri:
    Value: !GetAtt Runtime.Outputs.SipUri
  BridgefuInstanceId:
    Value: !GetAtt Runtime.Outputs.InstanceId
  VapiAssistantId:
    Value: !GetAtt VapiResources.Outputs.AssistantId
  VapiPrepareToolId:
    Value: !GetAtt VapiResources.Outputs.PrepareToolId
  VapiWebhookCredentialId:
    Value: !GetAtt VapiResources.Outputs.WebhookCredentialId
  ConnectWrapperFlowArn:
    Value: !GetAtt ConnectIntegration.Outputs.WrapperFlowArn
  AgentGuideFlowArn:
    Value: !GetAtt ConnectIntegration.Outputs.AgentGuideFlowArn
  HandoffTableName:
    Value: !GetAtt HandoffService.Outputs.HandoffTableName
  CorrelationKeySecretArn:
    Description: Secret ARN only; the correlation key value is never a stack output.
    Value: !GetAtt HandoffService.Outputs.CorrelationKeySecretArn
  RuntimeLogGroupName:
    Value: !GetAtt Runtime.Outputs.RuntimeLogGroupName
  LookupLogGroupName:
    Value: !GetAtt HandoffService.Outputs.LookupLogGroupName
  ScreenPopSchemaHash:
    Value: !GetAtt Configuration.Outputs.SchemaHash
  DashboardUrl:
    Value: !GetAtt Observability.Outputs.DashboardUrl
  SsmStartSessionCommand:
    Value: !GetAtt Runtime.Outputs.SsmStartSessionCommand
  VapiRetentionNotice:
    Value: The Vapi assistant, tool, and credential are retained when this stack is deleted.
