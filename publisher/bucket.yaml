AWSTemplateFormatVersion: '2010-09-09'
Description: Public, versioned release bucket for Bridgefu Vapi AWS Connect artifacts.

Parameters:
  BucketName:
    Type: String
    MinLength: 3
    MaxLength: 63

Resources:
  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  PublicReleaseRead:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicQualifiedReleaseRead
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub '${ReleaseBucket.Arn}/releases/*'
              - !Sub '${ReleaseBucket.Arn}/latest/*'
            Condition:
              StringEquals:
                s3:ExistingObjectTag/bridgefu-publication-status: published
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ReleaseBucket.Arn, !Sub '${ReleaseBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

Outputs:
  BucketName: {Value: !Ref ReleaseBucket}
  BucketArn: {Value: !GetAtt ReleaseBucket.Arn}
