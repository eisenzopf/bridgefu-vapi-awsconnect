AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub OIDC runner and CloudFormation service roles for disposable Bridgefu
  live qualification. GitHub cannot assume the deployment service role.

Parameters:
  GitHubOidcProviderArn: {Type: String}
  GitHubRepositoryOwner:
    Type: String
    Default: eisenzopf
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
  GitHubRepositoryOwnerId:
    Type: String
    Default: '9158070'
    AllowedPattern: '^[0-9]+$'
  GitHubRepositoryName:
    Type: String
    Default: bridgefu-vapi-awsconnect
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
  GitHubRepositoryId:
    Type: String
    Default: '1328315150'
    AllowedPattern: '^[0-9]+$'
  GitHubEnvironment:
    Type: String
    Default: live-qualification
  VapiApiKeySecretArn:
    Type: String
    AllowedPattern: '^arn:aws[-a-z0-9]*:secretsmanager:[-a-z0-9]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Qualification Vapi API key secret in us-west-2.
  VapiApiKeySecretArnUsEast1:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[-a-z0-9]*:secretsmanager:us-east-1:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Replica of the qualification Vapi API key secret in us-east-1.
  ArtifactBucketPrefix:
    Type: String
    Default: bridgefu-vapi-awsconnect
    AllowedPattern: '^[a-z0-9][a-z0-9-]+$'
  ReleaseSigningKeyArn:
    Type: String
    AllowedPattern: '^arn:aws[-a-z0-9]*:kms:[-a-z0-9]+:[0-9]{12}:key/[0-9a-f-]{36}$'
    Description: Exact publisher signing key used to verify qualified receipts.

Conditions:
  HasUsEast1VapiSecret: !Not [!Equals [!Ref VapiApiKeySecretArnUsEast1, '']]

Resources:
  QualificationCloudFormationServiceRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: bridgefu-vapi-awsconnect-qualification-cloudformation
      Description: >-
        Service role used only by CloudFormation for disposable bfq-* stacks.
        GitHub cannot assume this role; the runner can only pass this exact ARN.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  QualificationRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bridgefu-vapi-awsconnect-qualification-runner
      Description: Orchestrates only protected disposable Bridgefu release qualifications.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubRepositoryOwner}@${GitHubRepositoryOwnerId}/${GitHubRepositoryName}@${GitHubRepositoryId}:environment:${GitHubEnvironment}
                token.actions.githubusercontent.com:workflow:
                  - Build and qualify private candidate
                  - Remote live qualification
      Policies:
        - PolicyName: DisposableQualificationOrchestration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactCloudFormationServiceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt QualificationCloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: DisposableStackLifecycle
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/bridgefu-bfq-*/*'
              - Sid: PreflightStackAbsence
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Sid: ReadReleaseAndManageQualificationObjects
                Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketPrefix}-*'
                Condition:
                  StringLike:
                    s3:prefix:
                      - candidates/*
                      - releases/*
                      - qualification/bfq-*/*
              - Sid: ReadPrivateCandidateAndReleaseObjects
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketPrefix}-*/candidates/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketPrefix}-*/releases/*'
              - Sid: ManageQualificationObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketPrefix}-*/qualification/bfq-*/*'
              - Sid: ReadExactVapiKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref VapiApiKeySecretArn
                  - !If
                    - HasUsEast1VapiSecret
                    - !Ref VapiApiKeySecretArnUsEast1
                    - !Ref AWS::NoValue
              - Sid: VerifyQualifiedCandidateReceipt
                Effect: Allow
                Action: kms:Verify
                Resource: !Ref ReleaseSigningKeyArn
              - Sid: InspectGeneratedQualificationSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:bridgefu-bfq-*'
              - Sid: ObserveDisposableConnect
                Effect: Allow
                Action:
                  - connect:DescribeInstance
                  - connect:ListInstances
                Resource: '*'
              - Sid: ListUsersOnlyInDisposableConnect
                Effect: Allow
                Action: connect:ListUsers
                Resource: !Sub 'arn:${AWS::Partition}:connect:*:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/ManagedBy: bridgefu-qualification
              - Sid: ListAgentStatusesForQualification
                Effect: Allow
                Action: connect:ListAgentStatuses
                Resource: !Sub 'arn:${AWS::Partition}:connect:*:${AWS::AccountId}:instance/*/agent-state/*'
              - Sid: SetStatusOnlyOnTaggedDisposableInstanceAndUser
                Effect: Allow
                Action: connect:PutUserStatus
                Resource:
                  - !Sub 'arn:${AWS::Partition}:connect:*:${AWS::AccountId}:instance/*'
                  - !Sub 'arn:${AWS::Partition}:connect:*:${AWS::AccountId}:instance/*/agent/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/ManagedBy: bridgefu-qualification
              - Sid: UseSelectedAgentStatusForQualification
                Effect: Allow
                Action: connect:PutUserStatus
                Resource: !Sub 'arn:${AWS::Partition}:connect:*:${AWS::AccountId}:instance/*/agent-state/*'
              - Sid: ObserveCandidateRuntime
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ssm:CancelCommand
                  - ssm:GetCommandInvocation
                  - ssm:SendCommand
                Resource: '*'
              - Sid: ProveQualificationPrivateDnsDeleted
                Effect: Allow
                Action: route53:GetHostedZone
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/*'
              - Sid: ReadQualificationEvidence
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - logs:FilterLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/bridgefu-bfq-*'
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/bridgefu/bfq-*:*'
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/bridgefu-bfq-*:*'
              - Sid: GenerateSyntheticSpeech
                Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'

Outputs:
  QualificationRunnerRoleArn:
    Value: !GetAtt QualificationRunnerRole.Arn
  QualificationCloudFormationServiceRoleArn:
    Value: !GetAtt QualificationCloudFormationServiceRole.Arn
