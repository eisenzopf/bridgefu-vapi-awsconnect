name: Remote live qualification

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable uploaded release version
        required: true
      region:
        description: Disposable Amazon Connect qualification region
        required: true
        default: us-west-2
        type: choice
        options: [us-west-2, us-east-1]

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgefu-vapi-awsconnect-live-qualification
  cancel-in-progress: false

jobs:
  sip-client:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build exact crates.io rvoip SIP source
        env:
          RUSTFLAGS: -C link-arg=-lm -C link-arg=-lc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl \
            --manifest-path qualification/sip-client/Cargo.toml
          file qualification/sip-client/target/aarch64-unknown-linux-musl/release/bridgefu-vapi-sip-smoke \
            | grep -F 'statically linked'
          qualification/sip-client/target/aarch64-unknown-linux-musl/release/bridgefu-vapi-sip-smoke \
            --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-sip-client
          path: qualification/sip-client/target/aarch64-unknown-linux-musl/release/bridgefu-vapi-sip-smoke
          if-no-files-found: error

  qualify:
    needs: sip-client
    runs-on: ubuntu-latest
    environment: live-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: qualification/package-lock.json}
      - uses: actions/download-artifact@v4
        with: {name: qualification-sip-client, path: target/qualification-client}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - name: Install pinned qualification dependencies
        run: |
          python -m pip install -r qualification/requirements-runner.txt
          npm --prefix qualification ci --ignore-scripts
          PLAYWRIGHT_BROWSERS_PATH=0 npm --prefix qualification exec playwright install --with-deps chromium
      - name: Checkout the exact Bridgefu source used by the AMI
        run: |
          repository="$(jq -r .repository bridgefu.lock.json)"
          commit="$(jq -r .commit bridgefu.lock.json)"
          git clone --filter=blob:none --no-checkout "$repository" target/pinned-bridgefu
          git -C target/pinned-bridgefu checkout --detach "$commit"
          test "$(shasum -a 256 target/pinned-bridgefu/Cargo.lock | awk '{print $1}')" = \
            "$(jq -r .cargo_lock_sha256 bridgefu.lock.json)"
      - name: Run both live smoke paths and prove teardown
        env:
          VERSION: ${{ inputs.release_version }}
          REGION: ${{ inputs.region }}
          VAPI_PUBLIC_KEY: ${{ secrets.VAPI_PUBLIC_KEY }}
        run: |
          chmod 0700 target/qualification-client/bridgefu-vapi-sip-smoke
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="bridgefu-vapi-awsconnect-$account_id-us-east-1"
          execution_id="bfq-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python qualification/controller.py run \
            --execution-id "$execution_id" \
            --release "$VERSION" \
            --region "$REGION" \
            --template-url "https://$bucket.s3.us-east-1.amazonaws.com/releases/$VERSION/qualification/cloudformation/template.yaml" \
            --vapi-secret-arn "${{ vars.VAPI_API_KEY_SECRET_ARN }}" \
            --hosted-zone-id "${{ vars.PUBLIC_HOSTED_ZONE_ID }}" \
            --hosted-zone-name "${{ vars.PUBLIC_HOSTED_ZONE_NAME }}" \
            --cloudformation-role-arn "${{ vars.AWS_QUALIFICATION_CLOUDFORMATION_ROLE_ARN }}" \
            --bridgefu-checkout target/pinned-bridgefu \
            --sip-client target/qualification-client/bridgefu-vapi-sip-smoke \
            --output target/live-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-qualification-${{ inputs.release_version }}-${{ inputs.region }}
          path: target/live-qualification
          if-no-files-found: warn
