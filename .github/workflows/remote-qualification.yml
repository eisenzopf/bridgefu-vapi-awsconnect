name: Remote live qualification

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Privately qualified candidate version
        required: true
      candidate_commit:
        description: Full bridgefu-vapi-awsconnect commit from the candidate receipt
        required: true
      region:
        description: Disposable Amazon Connect qualification region
        required: true
        default: us-west-2
        type: choice
        options: [us-west-2, us-east-1]

permissions:
  contents: read
  id-token: write

concurrency:
  # Shared with candidate creation and qualification recovery. This is a
  # repository-wide mutex, not a region- or candidate-specific throttle.
  group: bridgefu-vapi-awsconnect-qualification-mutation
  cancel-in-progress: false

jobs:
  sip-client:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      originating_attempt: ${{ steps.origin.outputs.attempt }}
    steps:
      - name: Bind this qualification to its originating workflow attempt
        id: origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ inputs.candidate_commit }}'}
      - name: Build exact crates.io rvoip qualification clients
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          RUSTFLAGS: -C link-arg=-Wl,-Bstatic -C link-arg=-lm -C link-arg=-lc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          metadata="$(cargo metadata --locked --format-version 1 \
            --manifest-path qualification/direct-secure-probe/Cargo.toml)"
          jq -e '
            ([.packages[] |
              select(.name == "bridgefu-direct-secure-probe") |
              .dependencies[] |
              select(.name == "rvoip-sip" and
                .req == "=0.3.8" and
                .source == "registry+https://github.com/rust-lang/crates.io-index" and
                .uses_default_features == false)] | length) == 1 and
            ([.packages[] |
              select(.name == "rvoip-sip" and
                .version == "0.3.8" and
                .source == "registry+https://github.com/rust-lang/crates.io-index")] |
              length) == 1' <<<"$metadata"
          cargo build --release --locked --target aarch64-unknown-linux-musl \
            --manifest-path qualification/sip-client/Cargo.toml
          cargo build --release --locked --target aarch64-unknown-linux-musl \
            --manifest-path qualification/direct-secure-probe/Cargo.toml
          sip_binary=qualification/sip-client/target/aarch64-unknown-linux-musl/release/bridgefu-vapi-sip-smoke
          probe_binary=qualification/direct-secure-probe/target/aarch64-unknown-linux-musl/release/bridgefu-direct-secure-probe
          mkdir -p target/qualification-clients
          for binary in "$sip_binary" "$probe_binary"; do
            file "$binary" | grep -F 'ARM aarch64'
            file "$binary" | grep -F 'statically linked'
            "$binary" --help >/dev/null
            install -m 0700 "$binary" target/qualification-clients/
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-native-clients
          path: target/qualification-clients
          if-no-files-found: error

  qualify:
    needs: sip-client
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    environment: live-qualification
    steps:
      - name: Reject a partial workflow rerun
        env:
          ORIGINATING_ATTEMPT: ${{ needs.sip-client.outputs.originating_attempt }}
        run: test "$GITHUB_RUN_ATTEMPT" = "$ORIGINATING_ATTEMPT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ inputs.candidate_commit }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22', cache: npm, cache-dependency-path: qualification/package-lock.json}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: qualification-native-clients, path: target/qualification-client}
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: ${{ inputs.region }}
      - name: Prove this is an existing private qualified candidate
        env:
          VERSION: ${{ inputs.release_version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          SIGNING_KEY_ARN: ${{ vars.RELEASE_SIGNING_KEY_ARN }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="bridgefu-vapi-awsconnect-$account_id-us-east-1"
          receipt_prefix="candidates/qualified/$VERSION/$CANDIDATE_COMMIT"
          exact_candidate_version() {
            key="$1"
            listing="$(aws s3api list-object-versions --region us-east-1 \
              --bucket "$bucket" --prefix "$key")"
            jq -er --arg key "$key" \
              '([.DeleteMarkers[]? | select(.Key == $key)] | length) == 0 and
               ([.Versions[]? | select(.Key == $key)] | length) == 1' \
              <<<"$listing" >/dev/null
            jq -er --arg key "$key" \
              '.Versions[] | select(.Key == $key and .IsLatest == true) |
               .VersionId' <<<"$listing"
          }
          receipt_version="$(exact_candidate_version "$receipt_prefix/receipt.json")"
          signature_version="$(exact_candidate_version "$receipt_prefix/receipt.sig")"
          aws s3api get-object --region us-east-1 --bucket "$bucket" \
            --key "$receipt_prefix/receipt.json" --version-id "$receipt_version" \
            target/candidate-receipt.json >/dev/null
          aws s3api get-object --region us-east-1 --bucket "$bucket" \
            --key "$receipt_prefix/receipt.sig" --version-id "$signature_version" \
            target/candidate-receipt.sig >/dev/null
          jq -e --arg version "$VERSION" --arg commit "$CANDIDATE_COMMIT" \
            --arg signing_key "$SIGNING_KEY_ARN" \
            '.schema == "bridgefu-qualified-candidate-receipt/v1" and
             .version == $version and .repository.commit == $commit and
             .signing_key_arn == $signing_key and
             (.qualification_assets | type == "array" and length == 2) and
             ([.qualification_assets[].key | split("/")[-1]] | sort) ==
               ["demo-site-manifest.json","demo-site.zip"] and
             ([.qualification_assets[] |
               .region == "us-east-1" and
               (.sha256 | test("^[0-9a-f]{64}$")) and
               (.size_bytes | type == "number" and . > 0)] | all) and
             ([.qualification_assets[] | [.region, .bucket, .key, .version_id] |
               join("\u0000")] | length == (unique | length)) and
             (.qualification | keys | sort) == ["us-east-1","us-west-2"] and
             ([.qualification[] |
               .evidence_schema_version == 2 and
               (.evidence_sha256 | test("^[0-9a-f]{64}$")) and
               (.zero_state_sha256 | test("^[0-9a-f]{64}$")) and
               (.zero_resource_proof_sha256 | test("^[0-9a-f]{64}$")) and
               (.runtime_image_sha256 | test("^[0-9a-f]{64}$")) and
               (.root_invocation_sha256 | test("^[0-9a-f]{64}$")) and
               .secure_preflight_passed == true and
               .required_checks_passed == true and
               .scenario_ids == ["bridgefu-web-sdk-handoff","vapi-sip-transfer"] and
               .zero_resource_proof == true] | all)' \
            target/candidate-receipt.json >/dev/null
          openssl dgst -sha256 -binary target/candidate-receipt.json \
            > target/candidate-receipt.digest
          aws kms verify --region us-east-1 --key-id "$SIGNING_KEY_ARN" \
            --signing-algorithm ECDSA_SHA_256 --message-type DIGEST \
            --message fileb://target/candidate-receipt.digest \
            --signature fileb://target/candidate-receipt.sig \
            --query SignatureValid --output text | grep -Fx True
          template_key="releases/$VERSION/qualification/cloudformation/template.yaml"
          template_record="$(jq -cer --arg key "$template_key" \
            '[.release_objects[] | select(.region == "us-east-1" and .key == $key)] |
             if length == 1 then .[0] else error(
               "qualification template is not uniquely bound") end' \
            target/candidate-receipt.json)"
          template_version="$(jq -r .version_id <<<"$template_record")"
          expected_sha="$(jq -r .sha256 <<<"$template_record")"
          head="$(aws s3api head-object --region us-east-1 --bucket "$bucket" \
            --key "$template_key" --version-id "$template_version")"
          test "$(jq -r .Metadata.sha256 <<<"$head")" = "$expected_sha"
          test "$(jq -r '.Metadata["candidate-id"]' <<<"$head")" = \
            "$(jq -r .candidate_id target/candidate-receipt.json)"
          mkdir -p target/qualification-inputs
          download_qualification_asset() {
            filename="$1"
            key="candidates/$(jq -r .candidate_id \
              target/candidate-receipt.json)/qualification/$filename"
            record="$(jq -cer --arg key "$key" \
              '[.qualification_assets[] | select(.region == "us-east-1" and
                .key == $key)] | if length == 1 then .[0] else error(
                "qualification asset is not uniquely bound") end' \
              target/candidate-receipt.json)"
            destination="target/qualification-inputs/$filename"
            aws s3api get-object --region us-east-1 \
              --bucket "$(jq -r .bucket <<<"$record")" --key "$key" \
              --version-id "$(jq -r .version_id <<<"$record")" \
              "$destination" >/dev/null
            test "$(sha256sum "$destination" | awk '{print $1}')" = \
              "$(jq -r .sha256 <<<"$record")"
            test "$(wc -c < "$destination" | tr -d ' ')" = \
              "$(jq -r .size_bytes <<<"$record")"
          }
          download_qualification_asset demo-site.zip
          download_qualification_asset demo-site-manifest.json
          demo_site_sha256="$(jq -er '.archive_sha256 |
            select(test("^[0-9a-f]{64}$"))' \
            target/qualification-inputs/demo-site-manifest.json)"
          test "$(sha256sum target/qualification-inputs/demo-site.zip |
            awk '{print $1}')" = "$demo_site_sha256"
          jq '{schema: "bridgefu-staged-release-objects/v1",
               objects: .release_objects}' target/candidate-receipt.json \
            > target/qualification-inputs/staged-objects.json
          templates=(
            cloudformation/template.yaml
            cloudformation/nested/configuration.yaml
            cloudformation/nested/network.yaml
            cloudformation/nested/handoff-service.yaml
            cloudformation/nested/connect.yaml
            cloudformation/nested/runtime.yaml
            cloudformation/nested/vapi.yaml
            cloudformation/nested/observability.yaml
            qualification/cloudformation/disposable-connect.yaml
            qualification/cloudformation/template.yaml
          )
          for relative in "${templates[@]}"; do
            key="releases/$VERSION/$relative"
            record="$(jq -cer --arg key "$key" --arg bucket "$bucket" \
              '[.release_objects[] | select(.region == "us-east-1" and
                .bucket == $bucket and .key == $key)] |
               if length == 1 then .[0] else error(
                 "sealed template is not uniquely bound") end' \
              target/candidate-receipt.json)"
            destination="target/qualification-inputs/release/$relative"
            mkdir -p "$(dirname "$destination")"
            head="$(aws s3api head-object --region us-east-1 \
              --bucket "$bucket" --key "$key" \
              --version-id "$(jq -r .version_id <<<"$record")")"
            test "$(jq -r .Metadata.sha256 <<<"$head")" = \
              "$(jq -r .sha256 <<<"$record")"
            test "$(jq -r '.Metadata["candidate-id"]' <<<"$head")" = \
              "$(jq -r .candidate_id target/candidate-receipt.json)"
            aws s3api get-object --region us-east-1 --bucket "$bucket" \
              --key "$key" --version-id "$(jq -r .version_id <<<"$record")" \
              "$destination" >/dev/null
            test "$(sha256sum "$destination" | awk '{print $1}')" = \
              "$(jq -r .sha256 <<<"$record")"
            test "$(wc -c < "$destination" | tr -d ' ')" = \
              "$(jq -r .size_bytes <<<"$record")"
          done
          echo "DEMO_SITE_SHA256=$demo_site_sha256" >> "$GITHUB_ENV"
          encoded_version="$(python -c \
            'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
            "$template_version")"
          echo "QUALIFICATION_TEMPLATE_VERSION=$encoded_version" >> "$GITHUB_ENV"
      - name: Install pinned qualification dependencies
        run: |
          session_manager_version=1.2.835.0
          session_manager_sha256=7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03
          curl --fail --location --silent --show-error \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/$session_manager_version/ubuntu_64bit/session-manager-plugin.deb" \
            --output /tmp/session-manager-plugin.deb
          echo "$session_manager_sha256  /tmp/session-manager-plugin.deb" | sha256sum --check --strict
          sudo dpkg --install /tmp/session-manager-plugin.deb
          command -v session-manager-plugin >/dev/null
          session-manager-plugin --version | grep -F "$session_manager_version"
          python -m pip install --require-hashes \
            -r qualification/requirements-runner.lock
          npm --prefix qualification ci --ignore-scripts
          PLAYWRIGHT_BROWSERS_PATH=0 npm --prefix qualification exec playwright install --with-deps chromium
      - name: Checkout the exact Bridgefu source used by the AMI
        run: |
          repository="$(jq -r .repository bridgefu.lock.json)"
          commit="$(jq -r .commit bridgefu.lock.json)"
          git clone --filter=blob:none --no-checkout "$repository" target/pinned-bridgefu
          git -C target/pinned-bridgefu checkout --detach "$commit"
          test "$(shasum -a 256 target/pinned-bridgefu/Cargo.lock | awk '{print $1}')" = \
            "$(jq -r .cargo_lock_sha256 bridgefu.lock.json)"
      - name: Acquire a fresh qualification AWS session for mutation
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: ${{ inputs.region }}
      - name: Verify live qualification control-plane bindings
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_CALLER_ROLE_ARN: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          EXPECTED_CFN_ROLE_ARN: ${{ vars.AWS_QUALIFICATION_CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_SIGNING_KEY_ARN: ${{ vars.RELEASE_SIGNING_KEY_ARN }}
          EXPECTED_VAPI_SECRET_WEST: ${{ vars.VAPI_API_KEY_SECRET_ARN_US_WEST_2 || vars.VAPI_API_KEY_SECRET_ARN }}
          EXPECTED_VAPI_SECRET_EAST: ${{ vars.VAPI_API_KEY_SECRET_ARN_US_EAST_1 }}
          EXPECTED_HOSTED_ZONE_ID: ${{ vars.PUBLIC_HOSTED_ZONE_ID }}
        run: |
          set -euo pipefail
          python release/verify_release_control_plane.py \
            --mode qualification \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --expected-caller-role-arn "$EXPECTED_CALLER_ROLE_ARN" \
            --expected-cloudformation-role-arn "$EXPECTED_CFN_ROLE_ARN" \
            --expected-signing-key-arn "$EXPECTED_SIGNING_KEY_ARN" \
            --expected-vapi-secret-west "$EXPECTED_VAPI_SECRET_WEST" \
            --expected-vapi-secret-east "$EXPECTED_VAPI_SECRET_EAST" \
            --expected-hosted-zone-id "$EXPECTED_HOSTED_ZONE_ID"
      - name: Run both live smoke paths and prove teardown
        env:
          VERSION: ${{ inputs.release_version }}
          REGION: ${{ inputs.region }}
          VAPI_SECRET_WEST: ${{ vars.VAPI_API_KEY_SECRET_ARN_US_WEST_2 || vars.VAPI_API_KEY_SECRET_ARN }}
          VAPI_SECRET_EAST: ${{ vars.VAPI_API_KEY_SECRET_ARN_US_EAST_1 }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          chmod 0700 \
            target/qualification-client/bridgefu-vapi-sip-smoke \
            target/qualification-client/bridgefu-direct-secure-probe
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID"
          bucket="bridgefu-vapi-awsconnect-$account_id-us-east-1"
          case "$REGION" in
            us-west-2) vapi_secret_arn="$VAPI_SECRET_WEST"; short_region=w ;;
            us-east-1) vapi_secret_arn="$VAPI_SECRET_EAST"; short_region=e ;;
            *) exit 2 ;;
          esac
          test -n "$vapi_secret_arn"
          runtime_image_id="$(jq -er --arg region "$REGION" \
            '.regional_amis[$region].ami_id |
             select(test("^ami-[0-9a-f]{17}$"))' \
            target/candidate-receipt.json)"
          execution_id="bfq-${short_region}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python qualification/controller.py run \
            --execution-id "$execution_id" \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --release "$VERSION" \
            --region "$REGION" \
            --template-url "https://$bucket.s3.us-east-1.amazonaws.com/releases/$VERSION/qualification/cloudformation/template.yaml?versionId=$QUALIFICATION_TEMPLATE_VERSION" \
            --staged-objects target/qualification-inputs/staged-objects.json \
            --sealed-template-root target/qualification-inputs/release \
            --runtime-image-id "$runtime_image_id" \
            --vapi-secret-arn "$vapi_secret_arn" \
            --hosted-zone-id "${{ vars.PUBLIC_HOSTED_ZONE_ID }}" \
            --hosted-zone-name "${{ vars.PUBLIC_HOSTED_ZONE_NAME }}" \
            --cloudformation-role-arn "${{ vars.AWS_QUALIFICATION_CLOUDFORMATION_ROLE_ARN }}" \
            --bridgefu-checkout target/pinned-bridgefu \
            --sip-client target/qualification-client/bridgefu-vapi-sip-smoke \
            --direct-secure-probe target/qualification-client/bridgefu-direct-secure-probe \
            --demo-site-archive target/qualification-inputs/demo-site.zip \
            --demo-site-sha256 "$DEMO_SITE_SHA256" \
            --output target/live-qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-qualification-${{ inputs.release_version }}-${{ inputs.region }}
          path: target/live-qualification
          if-no-files-found: warn
