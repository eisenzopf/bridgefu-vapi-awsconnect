name: Remote CloudFormation qualification

on:
  workflow_dispatch:
    inputs:
      release_version: {description: Immutable release version, required: true}
      region:
        description: Amazon Connect deployment region
        required: true
        default: us-west-2
        type: choice
        options:
          - us-west-2
          - us-east-1
          - af-south-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-southeast-1
          - ap-southeast-2
          - ca-central-1
          - eu-central-1
          - eu-west-2
      parameters_file: {description: Repository environment parameter JSON path, required: true}

permissions:
  contents: read
  id-token: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: live-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_QUALIFICATION_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - name: Deploy fresh qualification stack
        env:
          VERSION: ${{ inputs.release_version }}
          REGION: ${{ inputs.region }}
          PARAMS: ${{ inputs.parameters_file }}
        run: |
          execution_id="qual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stack_name="bridgefu-$execution_id"
          echo "QUALIFICATION_STACK=$stack_name" >> "$GITHUB_ENV"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="bridgefu-vapi-awsconnect-$account_id-us-east-1"
          template_url="https://$bucket.s3.us-east-1.amazonaws.com/releases/$VERSION/cloudformation/template.yaml"
          mkdir -p target
          aws cloudformation validate-template --region "$REGION" \
            --template-url "$template_url" > target/validate-template.json
          jq --arg id "$execution_id" \
            'map(select(.ParameterKey != "DeploymentId" and .ParameterKey != "DataRetentionMode")) + [{"ParameterKey":"DeploymentId","ParameterValue":$id},{"ParameterKey":"DataRetentionMode","ParameterValue":"TestDelete"}]' \
            "$PARAMS" > target/qualification-parameters.json
          aws cloudformation create-stack --region "$REGION" \
            --stack-name "$stack_name" --template-url "$template_url" \
            --parameters file://target/qualification-parameters.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --on-failure DELETE
          aws cloudformation wait stack-create-complete --region "$REGION" \
            --stack-name "$stack_name"
          aws cloudformation describe-stacks --region "$REGION" \
            --stack-name "$stack_name" > target/qualification-stack.json
      - name: Verify deployed Bridgefu service through SSM
        env:
          REGION: ${{ inputs.region }}
        run: |
          instance_id="$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey == "BridgefuInstanceId") | .OutputValue' target/qualification-stack.json)"
          test "$instance_id" != null
          command_id="$(aws ssm send-command --region "$REGION" \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["systemctl is-active bridgefu.service","curl --fail --silent --show-error --max-time 5 http://127.0.0.1:9090/readyz"]' \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --region "$REGION" \
            --command-id "$command_id" --instance-id "$instance_id"
          aws ssm get-command-invocation --region "$REGION" \
            --command-id "$command_id" --instance-id "$instance_id" \
            > target/qualification-health.json
      - name: Delete qualification stack and prove zero stack state
        if: always()
        env:
          REGION: ${{ inputs.region }}
        run: |
          mkdir -p target
          if [[ -n "${QUALIFICATION_STACK:-}" ]] && aws cloudformation describe-stacks \
            --region "$REGION" --stack-name "$QUALIFICATION_STACK" >/dev/null 2>&1; then
            aws cloudformation delete-stack --region "$REGION" \
              --stack-name "$QUALIFICATION_STACK"
            aws cloudformation wait stack-delete-complete --region "$REGION" \
              --stack-name "$QUALIFICATION_STACK"
          fi
          if [[ -n "${QUALIFICATION_STACK:-}" ]] && aws cloudformation describe-stacks \
            --region "$REGION" --stack-name "$QUALIFICATION_STACK" >/dev/null 2>&1; then
            echo '{"stack_absent":false}' > target/qualification-zero-state.json
            exit 1
          fi
          echo '{"stack_absent":true}' > target/qualification-zero-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-stack
          path: target/qualification-*.json
          if-no-files-found: warn
