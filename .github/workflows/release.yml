name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: bridgefu-vapi-awsconnect-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: hashicorp/setup-packer@main
        with: {version: '1.12.0'}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-west-2
      - name: Resolve release inputs
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$version" != "$TAG"
          test "$(jq -r .release_ready bridgefu.lock.json)" = true
          commit="$(jq -r .commit bridgefu.lock.json)"
          test "$commit" != 0000000000000000000000000000000000000000
          {
            echo "version=$version"
            echo "bridgefu_commit=$commit"
            echo "bridgefu_lock=$(jq -r .cargo_lock_sha256 bridgefu.lock.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and copy private AMIs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          packer init image/bridgefu.pkr.hcl
          packer build \
            -var aws_region=us-west-2 \
            -var bridgefu_commit=${{ steps.release.outputs.bridgefu_commit }} \
            -var bridgefu_cargo_lock_sha256=${{ steps.release.outputs.bridgefu_lock }} \
            -var release_version="$VERSION" \
            image/bridgefu.pkr.hcl
          source_ami="$(aws ec2 describe-images --owners self --region us-west-2 \
            --filters "Name=tag:BridgefuRelease,Values=$VERSION" \
            --query 'reverse(sort_by(Images,&CreationDate))[0].ImageId' --output text)"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          mkdir -p target
          echo '{}' > target/region-release.json
          while read -r region; do
            if [[ "$region" = us-west-2 ]]; then
              ami="$source_ami"
            else
              ami="$(aws ec2 copy-image --region "$region" \
                --source-region us-west-2 --source-image-id "$source_ami" \
                --name "bridgefu-vapi-awsconnect-$VERSION" --copy-image-tags \
                --query ImageId --output text)"
            fi
            aws ec2 wait image-available --region "$region" --image-ids "$ami"
            bucket="bridgefu-vapi-awsconnect-$account_id-$region"
            jq --arg region "$region" --arg ami "$ami" --arg bucket "$bucket" \
              '. + {($region): {"ami_id": $ami, "bucket": $bucket}}' \
              target/region-release.json > target/region-release.next.json
            mv target/region-release.next.json target/region-release.json
          done < <(jq -r '.regions[].code' release/regions.json)
      - name: Build and upload immutable artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          east_bucket="$(jq -r '.["us-east-1"].bucket' target/region-release.json)"
          python release/build_release.py \
            --version "$VERSION" \
            --regions-file target/region-release.json \
            --public-base-url "https://$east_bucket.s3.us-east-1.amazonaws.com" \
            --output target/release
          aws s3 cp target/release "s3://$east_bucket/releases/$VERSION" \
            --recursive --region us-east-1 --only-show-errors
          while read -r region; do
            [[ "$region" = us-east-1 ]] && continue
            bucket="$(jq -r --arg region "$region" '.[$region].bucket' target/region-release.json)"
            aws s3 cp target/release/artifacts/lambda \
              "s3://$bucket/releases/$VERSION/artifacts/lambda" \
              --recursive --region "$region" --only-show-errors
          done < <(jq -r '.regions[].code' release/regions.json)
      - name: Validate every regional template
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          east_bucket="$(jq -r '.["us-east-1"].bucket' target/region-release.json)"
          template_url="https://$east_bucket.s3.us-east-1.amazonaws.com/releases/$VERSION/cloudformation/template.yaml"
          while read -r region; do
            aws cloudformation validate-template --region "$region" --template-url "$template_url"
          done < <(jq -r '.regions[].code' release/regions.json)
      - name: Sign release manifest
        env:
          SIGNING_KEY_ARN: ${{ vars.RELEASE_SIGNING_KEY_ARN }}
        run: |
          openssl dgst -sha256 -binary target/release/manifest.json > target/manifest.digest
          aws kms sign --key-id "$SIGNING_KEY_ARN" --signing-algorithm ECDSA_SHA_256 \
            --region us-east-1 \
            --message-type DIGEST --message fileb://target/manifest.digest \
            --query Signature --output text | base64 --decode > target/release/manifest.sig
          aws s3 cp target/release/manifest.sig \
            "s3://$(jq -r '.["us-east-1"].bucket' target/region-release.json)/releases/${{ steps.release.outputs.version }}/manifest.sig" \
            --region us-east-1 --only-show-errors
      - name: Publish public launch permission last
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          while read -r region; do
            ami="$(jq -r --arg region "$region" '.[$region].ami_id' target/region-release.json)"
            snapshots="$(aws ec2 describe-images --region "$region" --image-ids "$ami" \
              --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' --output text)"
            for snapshot in $snapshots; do
              encrypted="$(aws ec2 describe-snapshots --region "$region" \
                --snapshot-ids "$snapshot" --query 'Snapshots[0].Encrypted' --output text)"
              test "$encrypted" = False
              aws ec2 modify-snapshot-attribute --region "$region" \
                --snapshot-id "$snapshot" --attribute createVolumePermission \
                --operation-type add --group-names all
            done
            aws ec2 modify-image-attribute --region "$region" --image-id "$ami" \
              --launch-permission 'Add=[{Group=all}]'
          done < <(jq -r '.regions[].code' release/regions.json)
          east_bucket="$(jq -r '.["us-east-1"].bucket' target/region-release.json)"
          aws s3 cp target/release/cloudformation/template.yaml \
            "s3://$east_bucket/latest/cloudformation/template.yaml" \
            --region us-east-1 --only-show-errors
          aws s3 cp target/release/manifest.json \
            "s3://$east_bucket/latest/manifest.json" \
            --region us-east-1 --only-show-errors
          aws s3 cp target/release/manifest.sig \
            "s3://$east_bucket/latest/manifest.sig" \
            --region us-east-1 --only-show-errors
          aws s3 cp target/release/quick-create-links.json \
            "s3://$east_bucket/latest/quick-create-links.json" \
            --region us-east-1 --only-show-errors
