name: Publish qualified release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgefu-vapi-awsconnect-release
  cancel-in-progress: false

jobs:
  publish-exact-qualified-candidate:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Resolve tag and download its immutable qualified receipt
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          version="${TAG#v}"
          test "$version" != "$TAG"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          east_bucket="bridgefu-vapi-awsconnect-$account_id-us-east-1"
          for region in us-west-2 us-east-1; do
            bucket="bridgefu-vapi-awsconnect-$account_id-$region"
            test "$(aws s3api get-bucket-versioning --region "$region" \
              --bucket "$bucket" --query Status --output text)" = Enabled
          done
          receipt_prefix="candidates/qualified/$version/$GITHUB_SHA"
          mkdir -p target/publication
          exact_candidate_version() {
            key="$1"
            listing="$(aws s3api list-object-versions --bucket "$east_bucket" \
              --prefix "$key")"
            jq -er --arg key "$key" \
              '([.DeleteMarkers[]? | select(.Key == $key)] | length) == 0 and
               ([.Versions[]? | select(.Key == $key)] | length) == 1' \
              <<<"$listing" >/dev/null
            jq -er --arg key "$key" \
              '.Versions[] | select(.Key == $key and .IsLatest == true) |
               .VersionId' <<<"$listing"
          }
          receipt_json_version="$(exact_candidate_version \
            "$receipt_prefix/receipt.json")"
          receipt_sig_version="$(exact_candidate_version \
            "$receipt_prefix/receipt.sig")"
          aws s3api get-object --bucket "$east_bucket" \
            --key "$receipt_prefix/receipt.json" \
            --version-id "$receipt_json_version" \
            target/publication/receipt.json >/dev/null
          aws s3api get-object --bucket "$east_bucket" \
            --key "$receipt_prefix/receipt.sig" \
            --version-id "$receipt_sig_version" \
            target/publication/receipt.sig >/dev/null
          jq -e --arg version "$version" --arg commit "$GITHUB_SHA" \
            --arg key "${{ vars.RELEASE_SIGNING_KEY_ARN }}" \
            '.schema == "bridgefu-qualified-candidate-receipt/v1" and
             .version == $version and .repository.commit == $commit and
             .signing_key_arn == $key and
             (.candidate_id | test("^candidate-[A-Za-z0-9.-]{8,96}$")) and
             (.regional_amis | keys | sort) == ["us-east-1","us-west-2"] and
             (.qualification_assets | type == "array" and length == 2) and
             ([.qualification_assets[].key | split("/")[-1]] | sort) ==
               ["demo-site-manifest.json","demo-site.zip"] and
             ([.qualification_assets[] |
               .region == "us-east-1" and
               (.sha256 | test("^[0-9a-f]{64}$")) and
               (.size_bytes | type == "number" and . > 0)] | all) and
             ([.qualification_assets[] | [.region, .bucket, .key, .version_id] |
               join("\u0000")] | length == (unique | length)) and
             (.qualification | keys | sort) == ["us-east-1","us-west-2"] and
             (.release_objects | length > 0) and
             ([.release_objects[] | [.region, .bucket, .key, .version_id] |
               join("\u0000")] | length == (unique | length)) and
             ([.qualification[] |
               .evidence_schema_version == 2 and
               .secure_preflight_passed == true and
               .required_checks_passed == true and
               .scenario_ids == ["bridgefu-web-sdk-handoff","vapi-sip-transfer"] and
               .zero_resource_proof == true] | all)' \
            target/publication/receipt.json >/dev/null
          if [[ "$(jq -r .release_ready bridgefu.lock.json)" != true ]]; then
            jq -e '(.qualification | keys | sort) == ["us-east-1","us-west-2"] and
              ([.qualification[] |
                .evidence_schema_version == 2 and
                .secure_preflight_passed == true and
                .required_checks_passed == true and
                .scenario_ids == ["bridgefu-web-sdk-handoff","vapi-sip-transfer"] and
                .zero_resource_proof == true] | all)' \
              target/publication/receipt.json >/dev/null
            echo 'bridgefu.lock.json is gated by the signed dual-region qualification receipt.'
          fi
          openssl dgst -sha256 -binary target/publication/receipt.json \
            > target/publication/receipt.digest
          aws kms verify --key-id "${{ vars.RELEASE_SIGNING_KEY_ARN }}" \
            --signing-algorithm ECDSA_SHA_256 --message-type DIGEST \
            --message fileb://target/publication/receipt.digest \
            --signature fileb://target/publication/receipt.sig \
            --query SignatureValid --output text | grep -Fx True
          {
            echo "VERSION=$version"
            echo "EAST_BUCKET=$east_bucket"
            echo "RECEIPT_PREFIX=$receipt_prefix"
            echo "CANDIDATE_RECEIPT_JSON_VERSION=$receipt_json_version"
            echo "CANDIDATE_RECEIPT_SIG_VERSION=$receipt_sig_version"
            echo "PUBLICATION_ATTEMPT=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
      - name: Verify every qualified object version and AMI
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          mkdir -p target/verified
          while IFS= read -r encoded; do
            object="$(printf '%s' "$encoded" | base64 --decode)"
            region="$(jq -r .region <<<"$object")"
            bucket="$(jq -r .bucket <<<"$object")"
            key="$(jq -r .key <<<"$object")"
            version_id="$(jq -r .version_id <<<"$object")"
            expected_sha="$(jq -r .sha256 <<<"$object")"
            expected_size="$(jq -r .size_bytes <<<"$object")"
            [[ "$key" == "releases/$VERSION/"* ]]
            bucket_prefix="${EAST_BUCKET%-us-east-1}"
            test "$bucket" = "$bucket_prefix-$region"
            if [[ "$region" = us-west-2 ]]; then
              [[ "$key" == "releases/$VERSION/artifacts/lambda/"* ]]
            else
              test "$region" = us-east-1
            fi
            relative="${key#"releases/$VERSION/"}"
            destination="target/verified/$region/$relative"
            mkdir -p "$(dirname "$destination")"
            aws s3api get-object --region "$region" --bucket "$bucket" \
              --key "$key" --version-id "$version_id" "$destination" >/dev/null
            head="$(aws s3api head-object --region "$region" --bucket "$bucket" \
              --key "$key" --version-id "$version_id")"
            test "$(jq -r '.Metadata["candidate-id"]' <<<"$head")" = \
              "$(jq -r .candidate_id target/publication/receipt.json)"
            test "$(sha256sum "$destination" | awk '{print $1}')" = "$expected_sha"
            test "$(wc -c < "$destination" | tr -d ' ')" = "$expected_size"
            tags="$(aws s3api get-object-tagging --region "$region" \
              --bucket "$bucket" --key "$key" --version-id "$version_id" \
              --output json)"
            status="$(jq -r '.TagSet[]? |
              select(.Key == "bridgefu-publication-status") | .Value' <<<"$tags")"
            test -z "$status"
          done < <(jq -r '.release_objects[] | @base64' target/publication/receipt.json)
          python release/build_release.py \
            --verify-existing target/verified/us-east-1 \
            --expected-version "$VERSION" \
            --expected-repository-commit "$GITHUB_SHA"
          manifest_sha="$(sha256sum target/verified/us-east-1/manifest.json | awk '{print $1}')"
          test "$manifest_sha" = "$(jq -r .manifest.sha256 target/publication/receipt.json)"
          jq -e --slurpfile receipt target/publication/receipt.json \
            '.supported_regions == $receipt[0].regional_amis and
             .object_versions.exact == true and
             .bridgefu.commit == $receipt[0].bridgefu_commit and
             .bridgefu.required_rvoip_version == "0.3.8" and
             .bridgefu.required_rvoip_source ==
               "registry+https://github.com/rust-lang/crates.io-index"' \
            target/verified/us-east-1/manifest.json >/dev/null
          assert_bound_version() {
            region="$1"
            relative="$2"
            expected="$3"
            jq -e --arg region "$region" \
              --arg key "releases/$VERSION/$relative" \
              --arg expected "$expected" \
              '[.release_objects[] | select(.region == $region and .key == $key)] |
               length == 1 and .[0].version_id == $expected' \
              target/publication/receipt.json >/dev/null
          }
          for region in us-east-1 us-west-2; do
            while IFS=$'\t' read -r name version_id; do
              assert_bound_version "$region" "artifacts/lambda/$name" "$version_id"
            done < <(jq -r --arg region "$region" \
              '.object_versions.lambda[$region] | to_entries[] |
               [.key, .value] | @tsv' target/verified/us-east-1/manifest.json)
          done
          while IFS=$'\t' read -r name version_id; do
            assert_bound_version us-east-1 "cloudformation/nested/$name" \
              "$version_id"
          done < <(jq -r '.object_versions.nested | to_entries[] |
            [.key, .value] | @tsv' target/verified/us-east-1/manifest.json)
          assert_bound_version us-east-1 \
            qualification/cloudformation/disposable-connect.yaml \
            "$(jq -r '.object_versions.qualification["disposable-connect.yaml"]' \
              target/verified/us-east-1/manifest.json)"
          assert_bound_version us-east-1 cloudformation/template.yaml \
            "$(jq -r .object_versions.product_template \
              target/verified/us-east-1/manifest.json)"
          openssl dgst -sha256 -binary target/verified/us-east-1/manifest.json \
            > target/publication/manifest.digest
          aws kms verify --key-id "${{ vars.RELEASE_SIGNING_KEY_ARN }}" \
            --signing-algorithm ECDSA_SHA_256 --message-type DIGEST \
            --message fileb://target/publication/manifest.digest \
            --signature fileb://target/verified/us-east-1/manifest.sig \
            --query SignatureValid --output text | grep -Fx True
          for region in us-west-2 us-east-1; do
            expected_evidence_sha="$(jq -r --arg region "$region" \
              '.qualification[$region].evidence_sha256' \
              target/publication/receipt.json)"
            test "$(sha256sum "target/verified/us-east-1/qualification/$region/evidence.json" \
              | awk '{print $1}')" = "$expected_evidence_sha"
            ami="$(jq -r --arg region "$region" '.regional_amis[$region].ami_id' \
              target/publication/receipt.json)"
            image="$(aws ec2 describe-images --owners self --region "$region" \
              --image-ids "$ami")"
            test "$(jq -r '.Images | length' <<<"$image")" = 1
            test "$(jq -r '.Images[0].State' <<<"$image")" = available
            test "$(jq -r '.Images[0].Architecture' <<<"$image")" = arm64
            test "$(jq -r '.Images[0].Tags[] | select(.Key == "BridgefuRelease") | .Value' \
              <<<"$image")" = "$VERSION"
            test "$(jq -r '.Images[0].Tags[] | select(.Key == "BridgefuRepositoryCommit") | .Value' \
              <<<"$image")" = "$GITHUB_SHA"
            test "$(jq -r '.Images[0].Tags[] | select(.Key == "BridgefuCandidateId") | .Value' \
              <<<"$image")" = \
              "$(jq -r .candidate_id target/publication/receipt.json)"
            test "$(jq -r '.Images[0].Tags[] | select(.Key == "BridgefuCommit") | .Value' \
              <<<"$image")" = "$(jq -r .bridgefu_commit target/publication/receipt.json)"
            test "$(jq -r '.Images[0].Tags[] | select(.Key == "BridgefuRvoipVersion") | .Value' \
              <<<"$image")" = 0.3.8
            permissions="$(aws ec2 describe-image-attribute --region "$region" \
              --image-id "$ami" --attribute launchPermission --output json)"
            jq -e '[.LaunchPermissions[]? | select(.Group == "all")] |
              length == 0' <<<"$permissions" >/dev/null
          done
      - name: Journal cancellation-safe publication ownership
        run: |
          set -euo pipefail
          state_key="candidates/publications/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/state.json"
          jq -n --arg schema bridgefu-publication-state/v1 \
            --arg version "$VERSION" --arg repository_commit "$GITHUB_SHA" \
            --arg receipt_key "$RECEIPT_PREFIX/receipt.json" \
            --arg receipt_sig_key "$RECEIPT_PREFIX/receipt.sig" \
            --arg receipt_version "$CANDIDATE_RECEIPT_JSON_VERSION" \
            --arg receipt_sig_version "$CANDIDATE_RECEIPT_SIG_VERSION" \
            --arg candidate_id "$(jq -r .candidate_id target/publication/receipt.json)" \
            --arg publication_attempt "$PUBLICATION_ATTEMPT" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: $schema, version: $version,
              repository_commit: $repository_commit, candidate_id: $candidate_id,
              publication_attempt: $publication_attempt,
              receipt_key: $receipt_key, receipt_version: $receipt_version,
              receipt_sig_key: $receipt_sig_key,
              receipt_sig_version: $receipt_sig_version,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              release_receipt_objects: [], latest_objects: [],
              cleanup_authorized: true}' > target/publication/state.json
          aws s3api put-object --bucket "$EAST_BUCKET" --key "$state_key" \
            --body target/publication/state.json >/dev/null
      - name: Stage exact signed release receipt copies privately
        run: |
          set -euo pipefail
          state_key="candidates/publications/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/state.json"
          persist_state() {
            aws s3api put-object --bucket "$EAST_BUCKET" --key "$state_key" \
              --body target/publication/state.json >/dev/null
          }
          for name in receipt.json receipt.sig; do
            source="target/publication/$name"
            key="releases/$VERSION/qualification/$name"
            sha256="$(sha256sum "$source" | awk '{print $1}')"
            size="$(wc -c < "$source" | tr -d ' ')"
            version_id="$(aws s3api put-object --bucket "$EAST_BUCKET" \
              --key "$key" --body "$source" --if-none-match '*' \
              --metadata "sha256=$sha256,candidate-id=$(jq -r .candidate_id \
                target/publication/receipt.json),publication-attempt=$PUBLICATION_ATTEMPT" \
              --query VersionId --output text)"
            test "$version_id" != None
            aws s3api get-object --bucket "$EAST_BUCKET" --key "$key" \
              --version-id "$version_id" "target/publication/exact-$name" >/dev/null
            test "$(sha256sum "target/publication/exact-$name" | awk '{print $1}')" = \
              "$sha256"
            jq --arg region us-east-1 --arg bucket "$EAST_BUCKET" --arg key "$key" \
              --arg version_id "$version_id" --arg sha256 "$sha256" \
              --argjson size_bytes "$size" \
              '.release_receipt_objects += [{region: $region, bucket: $bucket,
                key: $key, version_id: $version_id, sha256: $sha256,
                size_bytes: $size_bytes}]' target/publication/state.json \
              > target/publication/state.next.json
            mv target/publication/state.next.json target/publication/state.json
            persist_state
          done
      - name: Make the exact qualified AMIs public first
        run: |
          set -euo pipefail
          for region in us-west-2 us-east-1; do
            ami="$(jq -r --arg region "$region" '.regional_amis[$region].ami_id' \
              target/publication/receipt.json)"
            readarray -t snapshots < <(aws ec2 describe-images --region "$region" \
              --image-ids "$ami" \
              --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' \
              --output text | tr '\t' '\n')
            aws ec2 create-tags --region "$region" \
              --resources "$ami" "${snapshots[@]}" \
              --tags "Key=BridgefuPublicationAttempt,Value=$PUBLICATION_ATTEMPT"
            for snapshot in "${snapshots[@]}"; do
              encrypted="$(aws ec2 describe-snapshots --region "$region" \
                --snapshot-ids "$snapshot" --query 'Snapshots[0].Encrypted' --output text)"
              test "$encrypted" = False
              aws ec2 modify-snapshot-attribute --region "$region" \
                --snapshot-id "$snapshot" --attribute createVolumePermission \
                --operation-type add --group-names all
            done
            aws ec2 modify-image-attribute --region "$region" --image-id "$ami" \
              --launch-permission 'Add=[{Group=all}]'
          done
      - name: Publish exact release object versions and root template last
        run: |
          set -euo pipefail
          publish_tag="TagSet=[{Key=bridgefu-publication-status,Value=published},{Key=bridgefu-publication-attempt,Value=$PUBLICATION_ATTEMPT}]"
          publish_record() {
            object="$1"
            region="$(jq -r .region <<<"$object")"
            bucket="$(jq -r .bucket <<<"$object")"
            key="$(jq -r .key <<<"$object")"
            version_id="$(jq -r .version_id <<<"$object")"
            aws s3api put-object-tagging --region "$region" --bucket "$bucket" \
              --key "$key" --version-id "$version_id" --tagging "$publish_tag"
          }
          root_key="releases/$VERSION/cloudformation/template.yaml"
          while IFS= read -r encoded; do
            object="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(jq -r .key <<<"$object")" != "$root_key"
            publish_record "$object"
          done < <(jq -r --arg root "$root_key" \
            '.release_objects[] | select(.key != $root) | @base64' \
            target/publication/receipt.json)
          while IFS= read -r encoded; do
            publish_record "$(printf '%s' "$encoded" | base64 --decode)"
          done < <(jq -r '.release_receipt_objects[] | @base64' \
            target/publication/state.json)
          root_record="$(jq -c --arg root "$root_key" \
            '.release_objects[] | select(.key == $root)' \
            target/publication/receipt.json)"
          test -n "$root_record"
          publish_record "$root_record"
      - name: Update mutable latest pointers from verified bytes
        run: |
          set -euo pipefail
          state_key="candidates/publications/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/state.json"
          persist_state() {
            aws s3api put-object --bucket "$EAST_BUCKET" --key "$state_key" \
              --body target/publication/state.json >/dev/null
          }
          put_latest() {
            source="$1"
            key="$2"
            sha256="$(sha256sum "$source" | awk '{print $1}')"
            object_key="latest/$key"
            size="$(wc -c < "$source" | tr -d ' ')"
            version_id="$(aws s3api put-object --bucket "$EAST_BUCKET" \
              --key "$object_key" \
              --body "$source" \
              --metadata "sha256=$sha256,publication-run-id=$GITHUB_RUN_ID,publication-run-attempt=$GITHUB_RUN_ATTEMPT,publication-attempt=$PUBLICATION_ATTEMPT" \
              --tagging "bridgefu-publication-status=published&bridgefu-publication-attempt=$PUBLICATION_ATTEMPT" \
              --query VersionId --output text)"
            test "$version_id" != None
            jq --arg region us-east-1 --arg bucket "$EAST_BUCKET" \
              --arg key "$object_key" --arg version_id "$version_id" \
              --arg sha256 "$sha256" --argjson size_bytes "$size" \
              '.latest_objects += [{region: $region, bucket: $bucket, key: $key,
                version_id: $version_id, sha256: $sha256,
                size_bytes: $size_bytes}]' target/publication/state.json \
              > target/publication/state.next.json
            mv target/publication/state.next.json target/publication/state.json
            persist_state
          }
          put_latest target/verified/us-east-1/manifest.json manifest.json
          put_latest target/verified/us-east-1/manifest.sig manifest.sig
          put_latest target/verified/us-east-1/quick-create-links.json quick-create-links.json
          put_latest target/publication/receipt.json qualification/receipt.json
          put_latest target/publication/receipt.sig qualification/receipt.sig
          for region in us-west-2 us-east-1; do
            put_latest "target/verified/us-east-1/qualification/$region/evidence.json" \
              "qualification/$region/evidence.json"
          done
          put_latest target/verified/us-east-1/cloudformation/template.yaml \
            cloudformation/template.yaml
      - name: Verify the complete public state belongs to this attempt
        run: |
          set -euo pipefail
          verify_public_object() {
            object="$1"
            region="$(jq -r .region <<<"$object")"
            bucket="$(jq -r .bucket <<<"$object")"
            key="$(jq -r .key <<<"$object")"
            version_id="$(jq -r .version_id <<<"$object")"
            tags="$(aws s3api get-object-tagging --region "$region" \
              --bucket "$bucket" --key "$key" --version-id "$version_id")"
            test "$(jq -r '.TagSet[] | select(
              .Key == "bridgefu-publication-status") | .Value' <<<"$tags")" = \
              published
            test "$(jq -r '.TagSet[] | select(
              .Key == "bridgefu-publication-attempt") | .Value' <<<"$tags")" = \
              "$PUBLICATION_ATTEMPT"
          }
          while IFS= read -r encoded; do
            verify_public_object "$(printf '%s' "$encoded" | base64 --decode)"
          done < <(jq -r '.release_objects[] | @base64' \
            target/publication/receipt.json)
          for array in release_receipt_objects latest_objects; do
            while IFS= read -r encoded; do
              object="$(printf '%s' "$encoded" | base64 --decode)"
              verify_public_object "$object"
              if [[ "$array" = latest_objects ]]; then
                head="$(aws s3api head-object --bucket "$EAST_BUCKET" \
                  --key "$(jq -r .key <<<"$object")")"
                test "$(jq -r .VersionId <<<"$head")" = \
                  "$(jq -r .version_id <<<"$object")"
              fi
            done < <(jq -r --arg array "$array" '.[$array][] | @base64' \
              target/publication/state.json)
          done
          for region in us-west-2 us-east-1; do
            ami="$(jq -r --arg region "$region" '.regional_amis[$region].ami_id' \
              target/publication/receipt.json)"
            image="$(aws ec2 describe-images --owners self --region "$region" \
              --image-ids "$ami")"
            test "$(jq -r '.Images[0].Tags[] | select(
              .Key == "BridgefuPublicationAttempt") | .Value' <<<"$image")" = \
              "$PUBLICATION_ATTEMPT"
            aws ec2 describe-image-attribute --region "$region" --image-id "$ami" \
              --attribute launchPermission --output json \
              | jq -e '[.LaunchPermissions[] | select(.Group == "all")] |
                length == 1' >/dev/null
            while read -r snapshot; do
              snapshot_record="$(aws ec2 describe-snapshots --owner-ids self \
                --region "$region" --snapshot-ids "$snapshot" \
                --query 'Snapshots[0]' --output json)"
              test "$(jq -r '.Tags[] | select(
                .Key == "BridgefuPublicationAttempt") | .Value' \
                <<<"$snapshot_record")" = "$PUBLICATION_ATTEMPT"
              aws ec2 describe-snapshot-attribute --region "$region" \
                --snapshot-id "$snapshot" --attribute createVolumePermission \
                --output json | jq -e '[.CreateVolumePermissions[] |
                  select(.Group == "all")] | length == 1' >/dev/null
            done < <(jq -r '.Images[0].BlockDeviceMappings[].Ebs.SnapshotId' \
              <<<"$image")
          done
          state_key="candidates/publications/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/state.json"
          jq '.publication_complete = true' target/publication/state.json \
            > target/publication/state.next.json
          mv target/publication/state.next.json target/publication/state.json
          aws s3api put-object --bucket "$EAST_BUCKET" --key "$state_key" \
            --body target/publication/state.json >/dev/null
